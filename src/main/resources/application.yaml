spring:
  application:
    name: jokes

server:
  port: ${PORT:8080}

gemini:
  api-key: ${GEMINI_API_KEY:}
  base-url: https://generativelanguage.googleapis.com
  primary-model: gemini-3.5-flash
  secondary-model: gemini-2.5-flash-lite
  last-resort-model: gemini-1.5-flash

groq:
  api-key: ${GROQ_API_KEY:}
  base-url: https://api.groq.com/openai/v1

  primary-model: llama-3.3-70b-versatile
  secondary-model: llama-3.1-8b-instant

qwen:
  api-key: ${QWEN_API_KEY:}
  base-url: https://openrouter.ai/api/v1
  primary-model: qwen/qwen3-32b
  secondary-model: qwen/qwen3-8b

tavily:
  api-key: ${TAVILY_API_KEY:}
  base-url: https://api.tavily.com
  max-results: ${TAVILY_MAX_RESULTS:20}
  query-variants: ${TAVILY_QUERY_VARIANTS:2}

management:
  endpoints:
    web:
      exposure:
        include: health,info
